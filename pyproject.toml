[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-poison-lab"
version = "0.1.0"
description = "A local test range for agent memory poisoning: attacks, defenses and repair on synthetic targets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chroma = ["chromadb>=1.0"]
sqlitevec = ["sqlite-vec>=0.1.6"]
dev = []

[tool.setuptools]
packages = ["mpolab"]
