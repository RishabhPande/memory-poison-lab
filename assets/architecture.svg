<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="260" fill="#f4efec" rx="12"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#585254"/>
    </marker>
  </defs>
  <!-- writes -->
  <rect x="20" y="40" width="170" height="80" rx="10" fill="#ffffff" stroke="#eae9ea"/>
  <text x="105" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#251f21">Writes</text>
  <text x="105" y="86" text-anchor="middle" font-size="12" fill="#585254">owner policy</text>
  <text x="105" y="102" text-anchor="middle" font-size="12" fill="#a1222c">untrusted tool output</text>
  <!-- backend -->
  <rect x="250" y="40" width="200" height="80" rx="10" fill="#ffffff" stroke="#eae9ea"/>
  <text x="350" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#251f21">ReferenceMemory</text>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#585254">retain - recall - compact</text>
  <text x="350" y="96" text-anchor="middle" font-size="12" fill="#585254">trust label + true origin</text>
  <text x="350" y="112" text-anchor="middle" font-size="11.5" fill="#585254">adapter: ChromaMemory (local vectors)</text>
  <!-- screening badge -->
  <rect x="255" y="128" width="190" height="26" rx="13" fill="#fdf3dd" stroke="#e8cf9a"/>
  <text x="350" y="145" text-anchor="middle" font-size="12" fill="#8a5a00">defense 1: write-time screening</text>
  <!-- agent -->
  <rect x="510" y="40" width="160" height="80" rx="10" fill="#ffffff" stroke="#eae9ea"/>
  <text x="590" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#251f21">Scripted agent</text>
  <text x="590" y="80" text-anchor="middle" font-size="12" fill="#585254">recall, then decide</text>
  <text x="590" y="96" text-anchor="middle" font-size="12" fill="#585254">naive vs defended policy</text>
  <!-- decision -->
  <rect x="730" y="40" width="130" height="80" rx="10" fill="#ffffff" stroke="#eae9ea"/>
  <text x="795" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#251f21">Decision</text>
  <text x="795" y="86" text-anchor="middle" font-size="12" fill="#585254">which vendor?</text>
  <!-- repair -->
  <rect x="230" y="182" width="460" height="66" rx="10" fill="#e3efeb" stroke="#bcd6cd"/>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#2f6b5c">defense 2: origin-aware recall - labels can be laundered, provenance cannot</text>
  <text x="460" y="217" text-anchor="middle" font-size="12" fill="#2f6b5c">defense 3: conflict-scoped repair()</text>
  <text x="460" y="234" text-anchor="middle" font-size="12" fill="#2f6b5c">drops non-owner writes that contradict owner policy; keeps the rest</text>
  <!-- arrows -->
  <line x1="190" y1="80" x2="244" y2="80" stroke="#585254" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="80" x2="504" y2="80" stroke="#585254" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="80" x2="724" y2="80" stroke="#585254" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="120" x2="350" y2="180" stroke="#585254" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
